apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseguard-api
  namespace: pulseguard-prod
  labels:
    app: pulseguard-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Spin up 1 new pod before terminating an old one
      maxUnavailable: 0  # Guarantee 0 dropped capacity during deployments
  selector:
    matchLabels:
      app: pulseguard-api
  template:
    metadata:
      labels:
        app: pulseguard-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: pulseguard-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true  # Blocks attackers from writing malware to disk
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "150m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 15
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
