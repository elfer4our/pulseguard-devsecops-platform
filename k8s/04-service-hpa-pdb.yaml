apiVersion: v1
kind: Service
metadata:
  name: pulseguard-service
  namespace: pulseguard-prod
spec:
  type: ClusterIP
  selector:
    app: pulseguard-api
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulseguard-hpa
  namespace: pulseguard-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulseguard-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulseguard-pdb
  namespace: pulseguard-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: pulseguard-api
